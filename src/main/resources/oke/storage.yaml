# The storage classes OKE defines in every cluster, backed by local-path-provisioner instances that
# register under the OKE provisioner names. k3s applies this file from its auto-deploy directory.
# StorageClass definitions: oracle/oci-cloud-controller-manager manifests/container-storage-interface/
# storage-class.yaml (oci-bv) and manifests/volume-provisioner/storage-class.yaml (oci). The
# provisioner Deployment, RBAC and helper pod follow k3s's own manifests/local-storage.yaml.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oci-bv
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: blockvolume.csi.oraclecloud.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oci
provisioner: oracle.com/oci
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: floci-local-path-provisioner
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: floci-local-path-provisioner
rules:
- apiGroups: [""]
  resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["endpoints", "persistentvolumes", "pods"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: floci-local-path-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: floci-local-path-provisioner
subjects:
- kind: ServiceAccount
  name: floci-local-path-provisioner
  namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: floci-local-path-config-oci-bv
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/lib/rancher/k3s/storage"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "${VOL_DIR}"
    chmod 700 "${VOL_DIR}/.."
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "${VOL_DIR}"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: "rancher/mirrored-library-busybox:1.37.0"
        imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: floci-local-path-config-oci
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap": [],
      "sharedFileSystemPath": "/var/lib/floci-oke/oci-volumes"
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "${VOL_DIR}"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "${VOL_DIR}"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: "rancher/mirrored-library-busybox:1.37.0"
        imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci-local-path-provisioner-oci-bv
  namespace: kube-system
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: floci-local-path-provisioner-oci-bv
  template:
    metadata:
      labels:
        app: floci-local-path-provisioner-oci-bv
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: floci-local-path-provisioner
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: local-path-provisioner
        image: "rancher/local-path-provisioner:v0.0.34"
        imagePullPolicy: IfNotPresent
        command:
        - local-path-provisioner
        - start
        - --config
        - /etc/config/config.json
        - --provisioner-name
        - blockvolume.csi.oraclecloud.com
        - --configmap-name
        - floci-local-path-config-oci-bv
        - --service-account-name
        - floci-local-path-provisioner
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config/
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumes:
      - name: config-volume
        configMap:
          name: floci-local-path-config-oci-bv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci-local-path-provisioner-oci
  namespace: kube-system
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: floci-local-path-provisioner-oci
  template:
    metadata:
      labels:
        app: floci-local-path-provisioner-oci
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: floci-local-path-provisioner
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: local-path-provisioner
        image: "rancher/local-path-provisioner:v0.0.34"
        imagePullPolicy: IfNotPresent
        command:
        - local-path-provisioner
        - start
        - --config
        - /etc/config/config.json
        - --provisioner-name
        - oracle.com/oci
        - --configmap-name
        - floci-local-path-config-oci
        - --service-account-name
        - floci-local-path-provisioner
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config/
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumes:
      - name: config-volume
        configMap:
          name: floci-local-path-config-oci
